# Netlify configuration — Superior Taekwondo
# Netlify reads netlify.toml from the REPOSITORY ROOT (not from public/).
# Redirect rules here are mirrored in public/_redirects; keep the two in sync.

[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# --- 301s -------------------------------------------------------------------
# Two thin, cannibalising location pages folded into /locations/auckland/
# (2 and 0 clicks in 90 days, ~440 words of duplicated template copy each).
[[redirects]]
  from = "/locations/rodney-north-west"
  to = "/locations/auckland/"
  status = 301
  force = true

[[redirects]]
  from = "/locations/rodney-north-west/*"
  to = "/locations/auckland/"
  status = 301
  force = true

[[redirects]]
  from = "/locations/auckland-north-west"
  to = "/locations/auckland/"
  status = 301
  force = true

[[redirects]]
  from = "/locations/auckland-north-west/*"
  to = "/locations/auckland/"
  status = 301
  force = true

# www → apex
[[redirects]]
  from = "https://www.superiortkd.co.nz/*"
  to = "https://superiortkd.co.nz/:splat"
  status = 301
  force = true

# --- Headers ----------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# Astro fingerprints everything in /_astro/, so it is safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.webp"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/sitemap-index.xml"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/llms.txt"
  [headers.values]
    Cache-Control = "public, max-age=3600"
